<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Silenzio in Villa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&family=DM+Mono:wght@400;500&family=Public+Sans:wght@400;600;700&display=swap">
<style>
/* Noir da villa: verde bottiglia e ottone. Il rosso-bordeaux è solo per l'assassino e per gli errori. */
:root{
  --bg:#ece8dc; --surface:#f7f4ea; --ink:#1b2620; --muted:#5c665e; --line:#cfc8b3; --chip:#e0dac6;
  --brass:#8a6a1f; --brass-ink:#fffaf0; --blood:#8e1f2b; --blood-ink:#fff; --ok:#1f6a46; --ok-bg:#d6ebdd;
  --font-display:"Cormorant Garamond",Georgia,serif; --font-body:"Public Sans",system-ui,sans-serif; --font-mono:"DM Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1511; --surface:#16201a; --ink:#ebe6d6; --muted:#9aa79c; --line:#2b3a30; --chip:#1f2c24;
  --brass:#d1a847; --brass-ink:#1a1405; --blood:#e0707a; --blood-ink:#1f0609; --ok:#78d3a0; --ok-bg:#17301f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1511; --surface:#16201a; --ink:#ebe6d6; --muted:#9aa79c; --line:#2b3a30; --chip:#1f2c24;
  --brass:#d1a847; --brass-ink:#1a1405; --blood:#e0707a; --blood-ink:#1f0609; --ok:#78d3a0; --ok-bg:#17301f; color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
#app{max-width:560px;margin-inline:auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--font-display);font-weight:700;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(38px,11vw,54px);letter-spacing:.005em}
h2{font-size:27px}
h3{font-size:22px}
p{margin:0}
.eyebrow{font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--brass)}
.sotto{font-size:14px;color:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.head{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{font-family:var(--font-mono);font-size:13px;background:var(--chip);border-radius:999px;padding:5px 12px}
.chip b{font-weight:500}
.btn{background:var(--brass);color:var(--brass-ink);border:0;border-radius:8px;padding:12px 18px;font:600 16px var(--font-body);cursor:pointer;min-height:48px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;text-align:center}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.red{background:var(--blood);color:var(--blood-ink)}
.btn.big{width:100%;min-height:56px;font-size:18px}
.btn.sm{min-height:40px;padding:8px 14px;font-size:15px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.campo:focus-visible,.link:focus-visible,.carta:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.btn.tab[aria-pressed=true]{background:var(--brass);color:var(--brass-ink)}
.riga{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form{display:grid;gap:8px}
.form label{font-size:14px;font-weight:600}
.campo{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:16px var(--font-body);min-width:0}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;padding:8px 0}
.msg{color:var(--blood);font-size:14px;font-weight:600}
.codice{font-family:var(--font-mono);font-size:19px;font-weight:500;letter-spacing:.05em;background:var(--chip);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere}
code{font-family:var(--font-mono);background:var(--chip);border-radius:6px;padding:2px 6px}
details{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
summary{cursor:pointer;font-weight:600}
.regole{margin:10px 0 0;padding-left:20px;display:grid;gap:6px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line)}
th{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
td.n,th.n{text-align:right}
td.n,.n{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
tr.top td{font-weight:700}
td small{color:var(--muted);font-family:var(--font-mono);font-size:11px}
.scorri{overflow-x:auto}
ul.gioc{list-style:none;margin:0;padding:0;display:grid;gap:6px}
ul.gioc li{display:flex;justify-content:space-between;gap:8px;background:var(--bg);border-radius:8px;padding:9px 12px}
ul.gioc li.io{outline:2px solid var(--brass)}
ul.gioc small{color:var(--muted);font-family:var(--font-mono);font-size:12px}
/* carta ruolo */
.ruolo{border:2px dashed var(--line);border-radius:12px;padding:18px 16px;display:grid;gap:10px;background:var(--surface)}
.ruolo.a{border-style:solid;border-color:var(--blood);background:var(--blood);color:var(--blood-ink);text-align:center}
.ruolo.a .eyebrow{color:inherit;opacity:.85}
.segreti{display:grid;gap:8px}
.segreti div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;border-bottom:1px solid var(--line);padding-bottom:6px}
.segreti span{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.segreti b{font-family:var(--font-display);font-size:26px;line-height:1.1}
.grande{font-family:var(--font-display);font-size:clamp(34px,11vw,48px);line-height:1.05;font-weight:700}
/* tavolo */
.cat{display:grid;gap:6px}
.cat .eyebrow{color:var(--muted)}
.carte{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:6px}
.carta{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:9px 8px;font:500 15px var(--font-body);min-height:44px;text-align:center}
button.carta{cursor:pointer}
.carta.x{text-decoration:line-through;opacity:.45}
.carta.sel{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
/* interrogatorio */
.ordine{display:flex;flex-wrap:wrap;gap:6px}
.ordine span{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:14px;background:var(--surface)}
.ordine span.ora{background:var(--brass);color:var(--brass-ink);border-color:var(--brass);font-weight:700}
.ordine span.fatto{opacity:.45}
.ordine span.io{outline:2px solid var(--ink);outline-offset:1px}
.qa{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.qa li{border-left:3px solid var(--brass);padding-left:12px;display:grid;gap:2px}
.qa .d{font-size:14px;color:var(--muted)}
.qa .r{font-family:var(--font-display);font-size:21px;line-height:1.2}
.scelta{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.scelta .btn{min-height:54px;font-size:17px;overflow-wrap:anywhere}
.rifiuto{border-radius:10px;padding:12px 14px;font-size:15px;background:var(--chip);border-left:4px solid var(--brass)}
.rifiuto.p{border-left-color:var(--blood)}
.rivelato{border-radius:10px;background:var(--ok-bg);padding:12px 14px;display:grid;gap:4px}
</style>
</head>
<body>
<div id="app"></div>
<script src="client.js"></script>
</body>
</html>
